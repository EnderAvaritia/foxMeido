[project]
name = "foxMeido"
version = "0.1.0"
description = "foxMeido"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2>=2.4.2",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-milky>=1.3.0",
    "nonebot-plugin-alconna>=0.62.1",
    "nonebot-plugin-apscheduler>=0.5.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "websockets>=12",
    "playwright>=1.40",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    { name = "Milky", module_name = "nonebot.adapters.milky" }
]
plugins = ["nonebot_plugin_alconna", "nonebot_plugin_apscheduler"]

plugin_dirs = ["plugins"]

builtin_plugins = ["echo"]
